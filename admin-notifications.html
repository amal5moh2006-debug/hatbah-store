<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notifications</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .notification { padding: 10px; border: 1px solid #ccc; margin: 10px 0; border-radius: 5px; }
        .info { background-color: #e7f7ff; border-color: #a7c6ed; }
        .warning { background-color: #fff3cd; border-color: #ffeeba; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Admin Notifications</h1>
    <div class="notification info">New user registered.</div>
    <div class="notification warning">Password attempt failed.</div>
    <div class="notification error">Unauthorized access attempt detected!</div>
</body>
</html>
